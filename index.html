function pose(){
 return{
  head:{x:0,y:-300,r:42},
  torso:{x:-28,y:-250,w:56,h:100},
  armL:{x:-28,y:-245,x2:-80,y2:-170},
  armR:{x:28,y:-245,x2:80,y2:-170},
  legL:{x:-14,y:-150,x2:-30,y2:0},
  legR:{x:14,y:-150,x2:30,y2:0}
 };
}

function toLocal(mx,my){
 const dx=mx-base.x,dy=my-base.y,a=-sway;
 const cs=Math.cos(a),sn=Math.sin(a);
 return{x:dx*cs-dy*sn,y:dx*sn+dy*cs};
}

function distSeg(p,x1,y1,x2,y2){
 const vx=x2-x1,vy=y2-y1;
 const t=Math.max(0,Math.min(1,((p.x-x1)*vx+(p.y-y1)*vy)/(vx*vx+vy*vy)));
 return Math.hypot(p.x-(x1+t*vx),p.y-(y1+t*vy));
}

function hitTest(p){
 const P=pose();
 if(Math.hypot(p.x-P.head.x,p.y-P.head.y)<P.head.r+6)return"head";
 if(p.x>P.torso.x&&p.x<P.torso.x+P.torso.w&&p.y>P.torso.y&&p.y<P.torso.y+P.torso.h)return"body";
 for(const k of["armL","armR"])
  if(distSeg(p,P[k].x,P[k].y,P[k].x2,P[k].y2)<14)return"arm";
 for(const k of["legL","legR"])
  if(distSeg(p,P[k].x,P[k].y,P[k].x2,P[k].y2)<16)return"leg";
 return null;
}

 else if(e.k==="ufo"){

 }

 g.fillStyle="#000";

 g.lineWidth=3;

 if(xeyes){

   const x=hx+s*15,y=hy-5;
   g.beginPath();
   g.moveTo(x-6,y-6);
   g.lineTo(x+6,y+6);
   g.moveTo(x+6,y-6);
   g.lineTo(x-6,y+6);
   g.stroke();
  }

  g.beginPath();
  g.ellipse(hx,hy+18,9,12,0,0,7);

 }else{
  for(const s of[-1,1]){
   g.beginPath();
   g.arc(hx+s*15,hy-5,5,0,7);
   g.fill();
  }

  g.beginPath();

  if(damage>50)
   g.arc(hx,hy+24,10,1.15*Math.PI,1.85*Math.PI);
  else
   g.arc(hx,hy+10,12,0.1*Math.PI,0.9*Math.PI);

  g.stroke();
 }

 if(damage>65){
  const t=(performance.now()/90)%24;
  g.fillStyle="#4aa3ff";

  for(const s of[-1,1]){
   g.beginPath();
   g.ellipse(hx+s*15,hy+4+t,3,5,0,0,7);
   g.fill();
  }
 }

 if(damage>60){
  g.save();
  g.translate(hx+16,hy-28);
  g.rotate(.5);
  g.fillStyle="#f4b6b6";
  g.fillRect(-12,-4,24,8);
  g.fillRect(-4,-12,8,24);
  g.restore();
 }

 g.font="bold 15px sans-serif";
 g.textAlign="center";
 g.fillStyle="#fff";
 g.strokeStyle="#000";
 g.lineWidth=3;
 g.strokeText("JUNUS",0,-352);
 g.fillText("JUNUS",0,-352);
}

function limb(x,y,x2,y2,w,col){
 g.strokeStyle=col;
 g.lineWidth=w;
 g.lineCap="round";
 g.beginPath();
 g.moveTo(x,y);
 g.lineTo(x2,y2);
 g.stroke();
}

/* =====================================================
   IMPACT
===================================================== */

function impact(mx,my,key){
 const T=TOOLS[key];
 const p=toLocal(mx,my);
 const part=(hidden||fly)?null:hitTest(p);

 if(!part){
  if(T.splat)
   splats.push({x:mx,y:my,r:14+Math.random()*12,col:T.splat,life:500});

  sfx(mx,my,"RATÉ !");
  burst(mx,my,"💨",3);
  return;
 }

 const now=performance.now();

 combo=(now-lastHit<900)?combo+1:1;
 lastHit=now;
 hits++;

 const dir=mx<base.x?1:-1;
 const crit=part==="head"?1.3:1;

 if(state==="up")swayV+=dir*.05*T.pw;

 shake=key==="tickle"?25:8+T.pw*3;
 squash=key==="poke"?.1:Math.min(.45,.12+T.pw*.1);

 if(part==="head"){
  headV+=dir*.25*T.pw;
  if(state!=="down")dizzy=60;
 }

 damage=Math.min(100,damage+T.dmg*crit);

 if(T.bruise&&Math.random()<.9)
  addBruise(p.x,p.y);

 if(T.splat){
  marks.push({
   k:"s",x:p.x,y:p.y,
   r:T.big?24:12+Math.random()*10,
   col:T.splat,life:900
  });

  if(marks.length>45)marks.shift();
 }

 burst(
  mx,my,
  part==="head"&&key!=="tickle"?"⭐":T.fx,
  key==="tickle"?4:7
 );

 sfx(mx,my,T.sfx);

 if(state==="down"){
  downTimer=Math.min(downTimer+40,380);
  say("JUNUS : "+pick(beg));
 }else{
  let t;

  if(damage>=70&&Math.random()<.5)
   t="JUNUS : "+pick(beg);
  else if(damage>=40&&Math.random()<.35)
   t="JUNUS : "+pick(hurt);
  else if(T.tk)
   t="JUNUS : "+pick(tickle);
  else if(Math.random()<.6){
   const h=who==="Random"?pick(friends):who;
   const r=Math.random();

   if(r<.2){
    const subjects=Object.keys(about).filter(k=>k!==h);
    const subj=pick(subjects);
    t=h+" : "+pick(about[subj]);
   }else{
    t=h+" : "+pick(r<.6?quips[h]:generic);
   }
  }else{
   t="JUNUS : "+pick(lines[part]);
  }

  say(t);
 }

 if(combo>=5&&combo%5===0)
  say(`${combo}x COMBO ! JUNUS est FINI 💀`,146);

 if(state==="up"&&damage>=100)
  knockDown(dir);

 document.getElementById("score").innerHTML=
  `Hits: ${hits} &nbsp;|&nbsp; Combo: ${combo}`;
}

/* =====================================================
   MAIN ANIMATION LOOP
===================================================== */

function frame(){
 g.clearRect(0,0,c.width,c.height);

 /* ---------- CAR EVENT ---------- */

 if(car){
  if(car.ph==="in"){
   car.x+=9;

   if(car.x>=base.x-190){
    car.x=base.x-190;
    car.ph="wait";
    car.t=0;
   }
  }
  else if(car.ph==="wait"){
   if(++car.t>110){
    car.ph="eject";
    startFly({});
    hidden=false;
    sayLocked("Sami : DEHORS JUNUS ! 🚗💨",176,2500);
   }
  }
  else if(car.ph==="eject"){
   if(!fly)car.ph="out";
  }
  else if(car.ph==="out"){
   car.x-=11;
   if(car.x<-200)car=null;
  }
 }

 if(fly){
  fly.t++;
  if(fly.t>=fly.d)land();
 }

 updateEvent();

 /* ---------- BODY PHYSICS ---------- */

 if(fly||hidden){
  sway=0;
  swayV=0;
 }
 else if(state==="up"){
  swayV+=-sway*.04;
  swayV*=.93;
  sway+=swayV;

  if(damage>0)
   damage=Math.max(0,damage-.03);
 }
 else if(state==="down"){
  sway+=(fallDir*1.52-sway)*.18;
  swayV=0;
  downTimer--;
  dizzy=999;

  if(downTimer>0&&downTimer%95===0)
   say("JUNUS : "+pick(beg),150);

  if(downTimer<=0){
   state="rising";
   riseT=0;
   dizzy=0;
   say("JUNUS : Bon... je me relève. Mais c'est la dernière fois !",170);
  }
 }
 else if(state==="rising"){
  riseT++;
  sway+=(0-sway)*.07;

  if(riseT>45&&Math.abs(sway)<.05){
   state="up";
   damage=55;
   sway=0;
   swayV=0;
   burst(base.x,base.y-150,"💪",3);
  }
 }

 headV+=-headA*.08;
 headV*=.9;
 headA+=headV;

 squash*=.88;
 shake*=.9;

 if(dizzy>0&&state!=="down")dizzy--;

 const P=pose();
 const sx=1+squash*.5;
 const sy=1-squash;

 /* ---------- SPLATS ---------- */

 splats=splats.filter(s=>--s.life>0);

 for(const s of splats){
  g.globalAlpha=Math.min(1,s.life/150);
  g.fillStyle=s.col;

  g.beginPath();
  g.arc(s.x,s.y,s.r,0,7);
  g.fill();

  g.beginPath();
  g.arc(s.x+s.r,s.y+s.r*.8,s.r/3,0,7);
  g.fill();
 }

 g.globalAlpha=1;

 /* ---------- CAR DRAWING ---------- */

 if(car){
  g.font="95px sans-serif";
  g.textAlign="center";

  g.save();
  g.translate(car.x,base.y-5);

  if(car.ph!=="out")g.scale(-1,1);

  g.fillText("🚗",0,0);
  g.restore();

  if(car.ph==="in"||car.ph==="wait"){
   g.font="34px sans-serif";
   g.fillText("😰",car.x+5,base.y-58);
  }

  if(car.ph==="out"){
   g.font="40px sans-serif";
   g.fillText("💨",car.x+90,base.y-10);
  }
 }

 /* ---------- JUNUS ---------- */

 if(!hidden){
  g.fillStyle="rgba(0,0,0,.2)";
  g.beginPath();
  g.ellipse(base.x,base.y+4,70,12,0,0,7);
  g.fill();

  g.save();

  let ox=0,oy=0,spin=0;

  if(fly){
   const u=Math.min(1,fly.t/fly.d);
   ox=fly.fromX*(1-u);
   oy=-Math.sin(u*Math.PI)*fly.h;
   spin=u*Math.PI*fly.spin;
  }

  g.translate(
   base.x+ox+(Math.random()-.5)*shake,
   base.y+oy
  );

  if(fly){
   g.translate(0,-150);
   g.rotate(spin);
   g.translate(0,150);
  }

  g.rotate(sway);
  g.scale(sx,sy);

  const skin="#f5c9a0";
  const shirt="#e8554e";
  const pants="#3a5fcd";

  limb(P.legL.x,P.legL.y,P.legL.x2,P.legL.y2,22,pants);
  limb(P.legR.x,P.legR.y,P.legR.x2,P.legR.y2,22,pants);

  g.fillStyle="#222";
  g.fillRect(-48,-8,36,10);
  g.fillRect(12,-8,36,10);

  limb(P.armL.x,P.armL.y,P.armL.x2,P.armL.y2,18,skin);
  limb(P.armR.x,P.armR.y,P.armR.x2,P.armR.y2,18,skin);

  g.fillStyle=shirt;
  g.beginPath();
  g.roundRect(P.torso.x,P.torso.y,P.torso.w,P.torso.h,14);
  g.fill();

  g.save();
  g.translate(0,-258);
  g.rotate(headA);
  g.translate(0,258);

  g.fillStyle=skin;
  g.beginPath();
  g.arc(P.head.x,P.head.y,P.head.r,0,7);
  g.fill();

  g.fillStyle="#4a2f1b";
  g.beginPath();
  g.arc(P.head.x,P.head.y-8,P.head.r+2,Math.PI,0);
  g.fill();

  face(P);
  g.restore();

  marks=marks.filter(m=>--m.life>0);

  for(const m of marks){
   g.globalAlpha=Math.min(1,m.life/150)*(m.k==="b"?.75:.95);
   g.fillStyle=m.col;

   if(m.k==="b"){
    g.beginPath();
    g.ellipse(m.x,m.y,m.r,m.r*.7,m.a,0,7);
    g.fill();

    g.fillStyle="rgba(255,255,255,.15)";
    g.beginPath();
    g.ellipse(m.x-2,m.y-2,m.r*.4,m.r*.3,m.a,0,7);
    g.fill();
   }else{
    g.beginPath();
    g.arc(m.x,m.y,m.r,0,7);
    g.fill();

    g.beginPath();
    g.ellipse(m.x+m.r*.4,m.y+m.r*1.1,m.r*.25,m.r*.6,0,0,7);
    g.fill();
   }
  }

  g.globalAlpha=1;

  if(dizzy>0){
   g.font="22px sans-serif";
   g.textAlign="center";

   for(let i=0;i<3;i++){
    const a=performance.now()/150+i*2.1;
    g.fillText("⭐",Math.cos(a)*45,-345+Math.sin(a)*10);
   }
  }

  if(state==="down"){
   g.font="44px sans-serif";
   g.textAlign="center";
   g.fillText("🏳️",P.armR.x2+10,P.armR.y2-25);
  }

  g.restore();
 }

 drawEvent();

 /* ---------- PARTICLES ---------- */

 particles=particles.filter(p=>p.life-->0);

 for(const p of particles){
  p.x+=p.vx;
  p.y+=p.vy;

  if(!p.txt)p.vy+=.5;

  g.globalAlpha=Math.min(1,p.life/20);
  g.font=p.txt?"bold 26px Impact,sans-serif":"24px sans-serif";
  g.textAlign="center";

  if(p.txt){
   g.strokeStyle="#000";
   g.lineWidth=4;
   g.strokeText(p.e,p.x,p.y);
   g.fillStyle="#ffd93b";
   g.fillText(p.e,p.x,p.y);
  }else{
   g.fillText(p.e,p.x,p.y);
  }
 }

 g.globalAlpha=1;

 /* ---------- PROJECTILES ---------- */

 proj=proj.filter(pr=>{
  if(pr.d>0){
   pr.d--;
   return true;
  }

  pr.t++;

  const u=Math.min(1,pr.t/pr.n);
  const x=pr.sx+(pr.mx-pr.sx)*u;
  const y=pr.sy+(pr.my-pr.sy)*u;

  g.save();
  g.translate(x,y);
  g.rotate(pr.t*.9);
  g.font="42px sans-serif";
  g.textAlign="center";
  g.fillText(TOOLS[pr.key].e,0,14);
  g.restore();

  if(pr.t>=pr.n){
   impact(pr.mx,pr.my,pr.key);
   return false;
  }

  return true;
 });

 /* ---------- DIGNITY BAR ---------- */

 const hp=Math.max(0,100-damage);

 g.fillStyle="rgba(0,0,0,.35)";
 g.fillRect(14,14,200,20);

 g.fillStyle=`hsl(${hp*1.2},80%,50%)`;
 g.fillRect(16,16,196*hp/100,16);

 g.font="bold 13px sans-serif";
 g.textAlign="left";
 g.strokeStyle="#000";
 g.lineWidth=3;

 const lbl=state==="down"?"K.O. 💫":"Dignité de JUNUS";

 g.strokeText(lbl,20,29);
 g.fillStyle="#fff";
 g.fillText(lbl,20,29);

 /* ---------- SPEECH BUBBLE ---------- */

 const nowT=performance.now();

 if(bubble&&nowT<bubble.until){
  g.font="bold 19px sans-serif";
  g.textAlign="left";

  const maxW=250;
  const words=bubble.t.split(" ");
  const rows=[];
  let cur="";

  for(const w of words){
   const t=cur?cur+" "+w:w;

   if(g.measureText(t).width>maxW&&cur){
    rows.push(cur);
    cur=w;
   }else{
    cur=t;
   }
  }

  rows.push(cur);

  const w=Math.max(...rows.map(r=>g.measureText(r).width))+30;
  const h=rows.length*24+20;

  const bx=Math.min(base.x+60,c.width-w-10);
  const by=45;

  g.fillStyle="#fff";
  g.strokeStyle="#000";
  g.lineWidth=3;

  g.beginPath();
  g.roundRect(bx,by,w,h,14);
  g.fill();
  g.stroke();

  g.beginPath();
  g.moveTo(bx+10,by+h-2);
  g.lineTo(base.x+40,by+h+45);
  g.lineTo(bx+40,by+h-2);
  g.fill();
  g.stroke();

  g.fillStyle="#000";

  rows.forEach((r,i)=>{
   g.fillText(r,bx+15,by+30+i*24);
  });
 }

 requestAnimationFrame(frame);
}

frame();
</script>
